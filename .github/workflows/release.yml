name: Release APK

# 打 tag 即发布：把可直接安装的 APK 挂到 Releases，得到一个稳定的下载直链
#   https://github.com/lgtnl/sit-drink-reminder/releases/latest/download/sit-drink-reminder-debug.apk
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # debug 包会用 debug 证书自动签名，可以直接侧载安装，
      # 无需你本地配置 keystore（正式发版再换 release 签名）
      - name: Assemble installable APK
        run: gradle assembleDebug --stacktrace

      - name: Show APK info
        run: ls -lh app/build/outputs/apk/debug/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk sit-drink-reminder-debug.apk
          SIZE=$(stat -c%s sit-drink-reminder-debug.apk)
          cat > release-notes.md <<'EOF'
          ## 久坐喝水提醒 · 轻量离线提醒 App

          下载下面的 `sit-drink-reminder-debug.apk` 直接安装（已用 debug 证书签名，可侧载）。

          ### 功能
          - 久坐提醒 / 喝水提醒，可分别开关
          - 两种方式：按间隔（每 N 分钟）或按时间点（每天多个时间）
          - 系统通知：提示音、震动可配置；点击通知打开 App
          - 退到后台仍提醒；手机重启、覆盖安装、改时区后自动恢复
          - 首页显示开关状态与下次提醒时间；深色模式；全中文
          - 完全离线：无 INTERNET 权限、无账号、无广告、无统计 SDK

          ### 安装
          1. 手机浏览器打开本页，下载 APK
          2. 允许「安装未知来源应用」
          3. 首次打开后按首页提示依次授权：通知 → 精确闹钟 → 电池优化

          ### 注意
          - Android 8.0（API 26）及以上
          - debug 包体积偏大（未混淆）；正式版请本地 `gradle assembleRelease` 并用你自己的 keystore 签名
          - 厂商 ROM 需手动允许后台运行/自启动，否则提醒可能延迟

          MIT License
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            sit-drink-reminder-debug.apk \
            --title "久坐喝水提醒 ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
          echo "APK size: ${SIZE} bytes"
